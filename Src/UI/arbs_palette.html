<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARBS Studio</title>
<style>
  :root {
    --green: #135027; --green-2: #1d6b38; --green-soft: #e6efe8;
    --navy: #002142; --ink: #1d2733; --muted: #5c6b79; --line: #d7dde3;
    --bg: #f6f7f8; --card: #ffffff; --warn: #9a6a00; --warn-bg: #fff4d6; --err: #b3261e; --err-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7ecef; --muted: #9aa7b3; --line: #39424b; --bg: #1f2428; --card: #2a3036; --green-soft: #22382a; --navy: #cfe0f0; --warn-bg: #3a3220; --err-bg: #3d2523; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 12px/1.4 "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  header img { height: 34px; }
  header .t { flex: 1; min-width: 0; }
  header .t b { display: block; font-size: 13px; color: var(--navy); }
  header .t span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .ver { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }
  nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--ink); cursor: pointer; font-size: 10px; line-height: 1.15; text-align: center; }
  nav button svg { width: 22px; height: 22px; stroke: var(--green); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  nav button:hover { background: var(--green-soft); }
  nav button.on { background: var(--green); color: #fff; }
  nav button.on svg { stroke: #fff; }
  main { flex: 1; overflow-y: auto; padding: 10px 12px 16px; }
  h2 { font-size: 13.5px; margin: 2px 0 2px; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .card h3 { font-size: 12px; margin: 0 0 6px; color: var(--green); }
  label.f { display: block; margin-bottom: 7px; }
  label.f span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--ink); font: inherit; }
  textarea { resize: vertical; min-height: 46px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .chk { display: flex; align-items: flex-start; gap: 7px; padding: 4px 0; cursor: pointer; }
  .chk input { margin: 2px 0 0; }
  .chk small { display: block; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  button.b { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; font: inherit; font-weight: 600; }
  button.b:hover { background: var(--green-2); }
  button.b.s { background: transparent; color: var(--green); }
  button.b:disabled { opacity: .5; cursor: default; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 9px; background: var(--green-soft); color: var(--green); font-weight: 600; white-space: nowrap; }
  .badge.w { background: var(--warn-bg); color: var(--warn); }
  .badge.e { background: var(--err-bg); color: var(--err); }
  .comp { border-top: 1px solid var(--line); padding: 6px 0; }
  .comp:first-of-type { border-top: none; }
  .comp .h { display: flex; align-items: center; gap: 7px; }
  .comp .h b { font-size: 11.5px; }
  .comp .h .n { flex: 1; min-width: 0; }
  .comp .h .n small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layers { margin: 5px 0 2px 22px; display: none; }
  .comp.open .layers { display: block; }
  .bar { display: flex; height: 16px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bar i { display: block; height: 100%; border-right: 1px solid rgba(0,0,0,.25); }
  .layers table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  .layers td { padding: 1px 3px; border-bottom: 1px dotted var(--line); }
  .layers td.r { text-align: right; white-space: nowrap; }
  .grp { font-weight: 700; color: var(--navy); margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .phase { border-left: 3px solid var(--green); padding: 4px 0 4px 8px; margin-bottom: 6px; }
  .phase ul { margin: 4px 0 0 16px; padding: 0; color: var(--muted); font-size: 11px; }
  details summary { cursor: pointer; color: var(--green); font-size: 11px; margin-top: 3px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; }
  .kv b { font-weight: 600; }
  table.t { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  table.t th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 2px 3px; }
  table.t td { border-bottom: 1px dotted var(--line); padding: 2px 3px; vertical-align: top; }
  table.t td.r { text-align: right; white-space: nowrap; }
  tr.crit td:first-child { box-shadow: inset 3px 0 0 var(--err); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
  .tile:hover { border-color: var(--green); }
  .tile b { display: block; color: var(--navy); margin-bottom: 2px; }
  .tile small { color: var(--muted); }
  footer { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--card); min-height: 34px; }
  footer .msg { flex: 1; min-width: 0; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer .msg.ok { color: var(--green); } footer .msg.err { color: var(--err); }
  footer button { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .hide { display: none !important; }
  .note { font-size: 11px; color: var(--muted); }
  .money { font-variant-numeric: tabular-nums; }
  input.pr { width: 74px; padding: 2px 4px; text-align: right; }
  input.pr.chg { border-color: var(--green); background: var(--green-soft); }
  .tot { font-size: 15px; font-weight: 700; color: var(--green); }
  .files a { display: block; color: var(--green); cursor: pointer; text-decoration: underline; font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" src="" style="display:none">
  <div class="t"><b>ARBS Studio</b><span id="projName">Archicad · Republika e Kosovës</span></div>
  <span class="ver" id="ver">v0.1</span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer><div class="msg" id="msg">Gati.</div><button id="openFolder" title="Hap dosjen e dokumenteve">Dosja</button></footer>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- ikonat
  const I = {
    profile: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/>',
    template: '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M9 9v11.5"/>',
    composites: '<path d="M4 6h16M4 10h16M4 14h16M4 18h16"/><path d="M8 6v12" stroke-dasharray="2 2"/>',
    techdesc: '<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5V8h4M9.5 12h6M9.5 15h6M9.5 18h4"/>',
    physics: '<path d="M4 19c3-9 6-12 8-12s4 6 8 6"/><path d="M4 5h4M4 9h2"/><circle cx="17" cy="6" r="2"/>',
    insolation: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
    schedules: '<rect x="4" y="3.5" width="7" height="17" rx="1"/><rect x="13" y="7" width="7" height="7" rx="1"/><path d="M13 10.5h7M16.5 7v7M9 12h.01"/>',
    boq: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8v3H8zM8.5 13.5h.01M12 13.5h.01M15.5 13.5h.01M8.5 17h.01M12 17h.01M15.5 17h.01"/>',
    plan: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M7 13h5M10 16.5h6"/>'
  };
  const SECTIONS = [
    ['profile', 'Projekti'], ['template', 'Template'], ['composites', 'Kompozitat'], ['techdesc', 'Përshkrimi'], ['boq', 'Paramasa'],
    ['physics', 'Fizika'], ['insolation', 'Insolimi'], ['schedules', 'Skemat'], ['plan', 'Plani dinamik']
  ];

  // ---------------------------------------------------------------- ura C++
  // Ura ARBS (C++) regjistrohet nga Archicad pak pas ngarkimit te faqes: presim deri ne 10 s.
  function bridgeReady () {
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function check () {
        if (window.ARBS && typeof window.ARBS.Call === 'function') return resolve(true);
        if (window.ARBSMock) return resolve(false);
        if (Date.now() - t0 > 10000) return resolve(false);
        setTimeout(check, 50);
      })();
    });
  }
  function call (cmd, data) {
    const req = JSON.stringify(Object.assign({ cmd: cmd }, data || {}));
    return bridgeReady().then(function (ok) {
      if (ok) return window.ARBS.Call(req).then(function (r) {
        try { return JSON.parse(r); }
        catch (e) { return { ok: false, error: 'Përgjigje e pavlefshme nga add-on-i (' + (r ? String(r).length : 0) + ' karaktere): ' + e.message }; }
      });
      return window.ARBSMock ? window.ARBSMock(cmd, data || {}) : { ok: false, error: 'Lidhja me Archicad-in nuk u krijua. Mbyllni dhe rihapni paletën.' };
    });
  }

  const S = { section: 'profile', catalog: null, office: {}, project: {}, plan: {}, model: null, busy: false };
  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  const num = function (v, d) { return (Number(v) || 0).toFixed(d == null ? 2 : d).replace('.', ','); };

  function status (text, kind) {
    const m = $('msg');
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.innerHTML = text;
  }

  function run (cmd, data, label) {
    if (S.busy) return Promise.resolve(null);
    S.busy = true;
    status('<span class="spin"></span> ' + esc(label || 'Duke punuar…'));
    return call(cmd, data).then(function (r) {
      S.busy = false;
      if (!r || !r.ok) { status(esc((r && r.error) || 'Gabim i panjohur.'), 'err'); return r; }
      status('U krye: ' + esc(label || cmd), 'ok');
      return r;
    }).catch(function (e) { S.busy = false; status(esc(String(e)), 'err'); return null; });
  }

  function filesHtml (r) {
    if (!r || !r.files || !r.files.length) return '';
    return '<div class="files">' + r.files.map(function (f) { return '<a data-open="' + esc(f) + '">' + esc(f.split(/[\\/]/).pop()) + '</a>'; }).join('') + '</div>';
  }

  document.addEventListener('click', function (e) {
    const a = e.target.closest('[data-open]');
    if (a) { call('open', { path: a.getAttribute('data-open') }); }
  });
  $('openFolder').onclick = function () { call('open', {}); };

  // ---------------------------------------------------------------- navigimi
  function buildNav () {
    $('nav').innerHTML = SECTIONS.map(function (s) {
      return '<button data-s="' + s[0] + '" title="' + s[1] + '"><svg viewBox="0 0 24 24">' + I[s[0]] + '</svg>' + s[1] + '</button>';
    }).join('');
    $('nav').onclick = function (e) { const b = e.target.closest('button'); if (b) open(b.getAttribute('data-s')); };
  }

  function open (section) {
    S.section = section;
    Array.prototype.forEach.call($('nav').children, function (b) { b.classList.toggle('on', b.getAttribute('data-s') === section); });
    const r = RENDER[section] || RENDER.profile;
    $('main').innerHTML = r();
    if (BIND[section]) BIND[section]();
    $('main').scrollTop = 0;
  }

  // ---------------------------------------------------------------- seksionet
  const OFFICE_FIELDS = [['kompania', 'Kompania / Studio'], ['arkitekti', 'Arkitekti përgjegjës'], ['titulli', 'Titulli (p.sh. Mr.sc. Arkitekt)'], ['licenca', 'Nr. i licencës'],
    ['adresa', 'Adresa'], ['telefoni', 'Telefoni'], ['email', 'Email'], ['web', 'Web-faqja']];

  const RENDER = {
    profile: function () {
      const fields = (S.catalog && S.catalog.projectFields) || [];
      const phases = (S.catalog && S.catalog.phases) || [];
      let h = '<h2>Profili i zyrës dhe projekti</h2><p class="sub">Të dhënat shfaqen në fletat, përshkrimin teknik dhe në Project Info të Archicad-it.</p>';
      h += '<div class="card"><h3>Profili i zyrës</h3>';
      OFFICE_FIELDS.forEach(function (f) { h += '<label class="f"><span>' + f[1] + '</span><input type="text" data-office="' + f[0] + '" value="' + esc(S.office[f[0]] || '') + '"></label>'; });
      h += '<label class="f"><span>Projektuesit e fazave (një për rresht)</span><textarea data-office="projektuesit">' + esc(Array.isArray(S.office.projektuesit) ? S.office.projektuesit.join('\n') : (S.office.projektuesit || '')) + '</textarea></label>';
      h += '<div class="btns"><button class="b" id="saveOffice">Ruaj profilin</button></div></div>';
      h += '<div class="card"><h3>Të dhënat e projektit</h3>';
      fields.forEach(function (f) {
        if (f.key === 'faza') {
          h += '<label class="f"><span>' + esc(f.label) + '</span><select data-proj="faza">' + phases.map(function (p) {
            return '<option value="' + esc(p.name) + '"' + (S.project.faza === p.name ? ' selected' : '') + '>' + esc(p.code + ' – ' + p.name) + '</option>'; }).join('') + '</select></label>';
        } else if (f.key === 'komuna') {
          h += '<label class="f"><span>' + esc(f.label) + '</span><select data-proj="komuna">' + (S.catalog.cities || []).map(function (c) {
            return '<option' + (S.project.komuna === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></label>';
        } else {
          h += '<label class="f"><span>' + esc(f.label) + '</span><input type="' + (f.number ? 'number' : 'text') + '" step="any" data-proj="' + f.key + '" placeholder="' + esc(f.example || '') + '" value="' + esc(S.project[f.key] == null ? '' : S.project[f.key]) + '"></label>';
        }
      });
      h += '<label class="chk"><input type="checkbox" id="pushInfo" checked><span>Shkruaj edhe në <b>Project Info</b> të Archicad-it</span></label>';
      h += '<div class="btns"><button class="b" id="saveProject">Ruaj projektin</button></div></div>';
      return h;
    },

    template: function () {
      const c = S.catalog || {};
      let h = '<h2>Template i punës në shqip</h2><p class="sub">Shtresat, kombinimet, View Map dhe Layout Book sipas fazave të dokumentimit (Ligji Nr. 04/L-110, UA MMPH 06/2017).</p>';
      h += '<div class="card"><h3>Fazat</h3>';
      (c.phases || []).forEach(function (p) {
        h += '<div class="phase"><label class="chk"><input type="checkbox" data-phase="' + p.code + '" checked><span><b>' + p.code + ' – ' + esc(p.name) + '</b><small>' + esc(p.purpose) + '</small></span></label>';
        h += '<details><summary>Dokumentet dhe fletat (' + (p.sheets || []).length + ')</summary><ul>' + (p.documents || []).map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>';
        h += '<ul>' + (p.sheets || []).map(function (s) { return '<li>' + esc(s.d + ' · ' + s.name + (s.scale ? ' ' + s.scale : '') + (s.perStorey ? ' (për çdo kat)' : '')) + '</li>'; }).join('') + '</ul></details></div>';
      });
      h += '</div><div class="card"><h3>Çfarë krijohet</h3>';
      [['layers', 'Shtresat (' + ((c.layers || []).length) + ') – A, K, S, I, D, P, X'], ['combinations', 'Kombinimet e shtresave (' + ((c.combinations || []).length) + ')'],
       ['viewMap', 'View Map: dosje për çdo fazë + pamjet e kateve, prerjeve dhe fasadave me shkallë'], ['layoutBook', 'Layout Book: subset për fazë dhe disiplinë, fletat dhe masterat A4–A1'],
       ['perStorey', 'Fleta të veçanta për çdo kat']].forEach(function (o) {
        h += '<label class="chk"><input type="checkbox" data-opt="' + o[0] + '" checked><span>' + esc(o[1]) + '</span></label>';
      });
      const n = c.naming || {};
      h += '<p class="note">Emërtimi: <b>' + esc(n.sheet || '') + '</b> · skedarët: <b>' + esc(n.file || '') + '</b><br>' + esc(n.example || '') + '</p>';
      h += '<div class="btns"><button class="b" id="runTemplate">Krijo template-in</button></div><div id="tplReport"></div></div>';
      h += '<p class="note">Pas krijimit: Skedari › Ruaj si… › <b>Archicad Project Template (.tpl)</b> – për ta përdorur si template të zyrës.</p>';
      return h;
    },

    composites: function () {
      const list = (S.catalog && S.catalog.composites) || [];
      const groups = [['wall', 'Muret'], ['slab', 'Dyshemetë, pllakat dhe themelet'], ['roof', 'Kulmet']];
      let h = '<h2>Kompozitat e materialeve</h2><p class="sub">Materiale të përdorura në Kosovë me λ, ρ, c dhe kontroll U sipas ' + esc((S.catalog && S.catalog.umaxSource) || '') + '.</p><div class="card">';
      groups.forEach(function (g) {
        h += '<div class="grp">' + g[1] + '</div>';
        list.filter(function (c) { return c.usage === g[0]; }).forEach(function (c) {
          const badge = c.umax > 0 ? (c.compliant ? '<span class="badge">U ' + num(c.u, 3) + ' ≤ ' + num(c.umax) + '</span>' : '<span class="badge e">U ' + num(c.u, 3) + ' &gt; ' + num(c.umax) + '</span>') : '<span class="badge w">U ' + num(c.u, 2) + '</span>';
          h += '<div class="comp" data-code="' + c.code + '"><div class="h"><input type="checkbox" data-comp="' + c.code + '" checked><div class="n"><b>' + esc(c.code) + '</b> ' + esc(c.name) + '<small>' + num(c.thickness / 10, 1) + ' cm · ' + esc(c.umaxLabel || 'pa kërkesë U') + '</small></div>' + badge + '</div>';
          h += '<div class="layers">' + layerBar(c) + '<table>' + c.layers.map(function (l) { return '<tr><td>' + esc(l.material) + (l.vent ? ' <i class="note">(vent.)</i>' : '') + '</td><td class="r">' + num(l.d / 10, l.d < 10 ? 2 : 1) + ' cm</td><td class="r">λ ' + num(l.lambda, 3) + '</td></tr>'; }).join('') + '</table><p class="note">' + esc(c.description) + '</p></div></div>';
        });
      });
      h += '</div><label class="chk"><input type="checkbox" id="updComp"><span>Përditëso kompozitat dhe materialet ekzistuese me të njëjtin emër</span></label>';
      h += '<div class="btns"><button class="b" id="mkComp">Krijo në Archicad</button><button class="b s" id="allComp">Zgjidh / hiq të gjitha</button></div><div id="compReport"></div>';
      return h;
    },

    techdesc: function () {
      let h = '<h2>Përshkrimi teknik</h2><p class="sub">Dokument Word (.doc) me 12 kapituj, i plotësuar nga të dhënat e projektit dhe modeli.</p>';
      h += '<div class="card"><h3>Përmbajtja</h3><div class="kv"><b>1–3</b><span>Të dhënat e përgjithshme, baza ligjore, lokacioni dhe treguesit urbanistikë</span><b>4</b><span>Zgjidhja funksionale – tabela e sipërfaqeve nga zonat</span><b>5–7</b><span>Konstruksioni, kompozitat e përdorura, dyert dhe dritaret</span><b>8</b><span>Performanca energjetike – U vs U<sub>max</sub></span><b>9–12</b><span>Zjarri, qasja, instalimet, mjedisi</span></div></div>';
      h += '<p class="note">Fushat që mungojnë shënohen me të verdhë në dokument. Plotësoni ato te «Projekti».</p>';
      h += '<div class="btns"><button class="b" id="mkTech">Gjenero përshkrimin teknik</button></div><div id="techOut"></div>';
      return h;
    },

    boq: function () {
      const pl = (S.catalog && S.catalog.prices) || { items: [], groups: [] };
      const own = (S.office && S.office.cmimet) || {};
      const b = S.boqParams || { vat: pl.vat != null ? pl.vat : 18, contingency: pl.contingency != null ? pl.contingency : 5, factor: 1, includeZero: false };

  function defaultStart () { const d = new Date(); d.setMonth(d.getMonth() + 1); d.setDate(1); return d.toISOString().slice(0, 10); }

  function layerBar (c) {
    const colors = { 'Konstruksion': '#b9bfc6', 'Murature': '#d99a73', 'Termoizolim': '#f4e27a', 'Membrana': '#3b4a5a', 'Suva': '#ece7dc', 'Fasadë': '#ece7dc', 'Dysheme': '#c8b28c', 'Dru': '#b8875a', 'Dheu': '#a59a83' };
    const total = c.layers.reduce(function (a, l) { return a + l.d; }, 0) || 1;
    return '<div class="bar">' + c.layers.map(function (l) { return '<i title="' + esc(l.material) + '" style="flex:' + Math.max(l.d / total, 0.015) + ';background:' + (l.vent ? '#fff' : (colors[l.group] || guessColor(l.material))) + '"></i>'; }).join('') + '</div>';
  }
  function guessColor (name) {
    name = name.toLowerCase();
    if (/eps|xps|lesh|pir|polistiren/.test(name)) return '#f4e27a';
    if (/beton/.test(name)) return '#b9bfc6';
    if (/bllok|tull/.test(name)) return '#d99a73';
    if (/membran|hidroizol|folie|barrier|gjeotek|drenazh/.test(name)) return '#3b4a5a';
    if (/parket|dru|osb|letva/.test(name)) return '#b8875a';
    if (/pllak|estrih|ngjit/.test(name)) return '#c8b28c';
    if (/zhavor|substrat/.test(name)) return '#a59a83';
    return '#ece7dc';
  }

  function readInputs (attr) {
    const o = {};
    document.querySelectorAll('[' + attr + ']').forEach(function (el) {
      const k = el.getAttribute(attr);
      let v = el.value;
      if (el.type === 'number') v = el.value === '' ? '' : Number(el.value);
      o[k] = v;
    });
    return o;
  }

  };

  function money (v) { const n = Math.round((Number(v) || 0) * 100) / 100; const p = n.toFixed(2).split('.'); return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1]; }
  function fmt (iso) { if (!iso) return ''; const p = String(iso).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso; }

  // ---------------------------------------------------------------- nisja
  window.ARBSUI = {
    open: function (s) { open(s); },
    onSelectionChanged: function () { }
  };

  buildNav();
  function boot () {
    status('<span class="spin"></span> Duke ngarkuar të dhënat…');
    return call('init', {}).then(function (r) {
    if (!r || !r.ok) { status(esc((r && r.error) || 'Nisja dështoi.') + ' <a href="#" id="retry">Provo përsëri</a>', 'err'); open('profile');
      var rt = PRetry(); if (rt) rt.onclick = function (e) { e.preventDefault(); boot(); }; return; }
    S.catalog = r.catalog; S.office = r.office || {}; S.project = r.project || {}; S.plan = r.plan || {};
    if (r.logo) { $('logo').src = r.logo; $('logo').style.display = ''; }
    $('ver').textContent = 'v' + r.version;
    if (S.project.emri) $('projName').textContent = (S.project.nr ? S.project.nr + ' · ' : '') + S.project.emri;
    if (r.catalogError) status('Të dhënat: ' + esc(r.catalogError), 'err');
    else status('Gati · dokumentet ruhen në: ' + esc(r.folder || ''));
    open(S.section);
    call('modelSummary', {}).then(function (m) { if (m && m.ok) S.model = m; });
    }).catch(function (e) { status('Gabim gjatë nisjes: ' + esc(String(e)), 'err'); });
  }
  function PRetry () { return $('retry'); }
  boot();
})();
</script>
</body>
</html>
