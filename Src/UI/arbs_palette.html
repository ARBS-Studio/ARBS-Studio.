<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARBS Studio</title>
<style>
  :root {
    --green: #135027; --green-2: #1d6b38; --green-soft: #e6efe8;
    --navy: #002142; --ink: #1d2733; --muted: #5c6b79; --line: #d7dde3;
    --bg: #f6f7f8; --card: #ffffff; --warn: #9a6a00; --warn-bg: #fff4d6; --err: #b3261e; --err-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7ecef; --muted: #9aa7b3; --line: #39424b; --bg: #1f2428; --card: #2a3036; --green-soft: #22382a; --navy: #cfe0f0; --warn-bg: #3a3220; --err-bg: #3d2523; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 12px/1.4 "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  header img { height: 34px; }
  header .t { flex: 1; min-width: 0; }
  header .t b { display: block; font-size: 13px; color: var(--navy); }
  header .t span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .ver { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }
  nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px; background: var(--card); border-bottom: 1px solid var(--line); }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--ink); cursor: pointer; font-size: 10px; line-height: 1.15; text-align: center; }
  nav button svg { width: 22px; height: 22px; stroke: var(--green); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  nav button:hover { background: var(--green-soft); }
  nav button.on { background: var(--green); color: #fff; }
  nav button.on svg { stroke: #fff; }
  main { flex: 1; overflow-y: auto; padding: 10px 12px 16px; }
  h2 { font-size: 13.5px; margin: 2px 0 2px; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .card h3 { font-size: 12px; margin: 0 0 6px; color: var(--green); }
  label.f { display: block; margin-bottom: 7px; }
  label.f span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--ink); font: inherit; }
  textarea { resize: vertical; min-height: 46px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .chk { display: flex; align-items: flex-start; gap: 7px; padding: 4px 0; cursor: pointer; }
  .chk input { margin: 2px 0 0; }
  .chk small { display: block; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  button.b { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; font: inherit; font-weight: 600; }
  button.b:hover { background: var(--green-2); }
  button.b.s { background: transparent; color: var(--green); }
  button.b:disabled { opacity: .5; cursor: default; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 9px; background: var(--green-soft); color: var(--green); font-weight: 600; white-space: nowrap; }
  .badge.w { background: var(--warn-bg); color: var(--warn); }
  .badge.e { background: var(--err-bg); color: var(--err); }
  .comp { border-top: 1px solid var(--line); padding: 6px 0; }
  .comp:first-of-type { border-top: none; }
  .comp .h { display: flex; align-items: center; gap: 7px; }
  .comp .h b { font-size: 11.5px; }
  .comp .h .n { flex: 1; min-width: 0; }
  .comp .h .n small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layers { margin: 5px 0 2px 22px; display: none; }
  .comp.open .layers { display: block; }
  .bar { display: flex; height: 16px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bar i { display: block; height: 100%; border-right: 1px solid rgba(0,0,0,.25); }
  .layers table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  .layers td { padding: 1px 3px; border-bottom: 1px dotted var(--line); }
  .layers td.r { text-align: right; white-space: nowrap; }
  .grp { font-weight: 700; color: var(--navy); margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .phase { border-left: 3px solid var(--green); padding: 4px 0 4px 8px; margin-bottom: 6px; }
  .phase ul { margin: 4px 0 0 16px; padding: 0; color: var(--muted); font-size: 11px; }
  details summary { cursor: pointer; color: var(--green); font-size: 11px; margin-top: 3px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; }
  .kv b { font-weight: 600; }
  table.t { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  table.t th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 2px 3px; }
  table.t td { border-bottom: 1px dotted var(--line); padding: 2px 3px; vertical-align: top; }
  table.t td.r { text-align: right; white-space: nowrap; }
  tr.crit td:first-child { box-shadow: inset 3px 0 0 var(--err); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
  .tile:hover { border-color: var(--green); }
  .tile b { display: block; color: var(--navy); margin-bottom: 2px; }
  .tile small { color: var(--muted); }
  footer { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--card); min-height: 34px; }
  footer .msg { flex: 1; min-width: 0; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer .msg.ok { color: var(--green); } footer .msg.err { color: var(--err); }
  footer button { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .hide { display: none !important; }
  .note { font-size: 11px; color: var(--muted); }
  .money { font-variant-numeric: tabular-nums; }
  input.pr { width: 74px; padding: 2px 4px; text-align: right; }
  table.t input.pr { width: 100%; min-width: 34px; }
  input.pr.chg { border-color: var(--green); background: var(--green-soft); }
  .tot { font-size: 15px; font-weight: 700; color: var(--green); }
  .files a { display: block; color: var(--green); cursor: pointer; text-decoration: underline; font-size: 11px; word-break: break-all; }
  /* licenca */
  #licBar { padding: 5px 12px; font-size: 11px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--line); cursor: pointer; }
  #licBar.ok { background: var(--green-soft); color: var(--green); }
  body.locked nav, body.locked #licBar { display: none; }
  .lic { text-align: center; padding: 18px 6px 6px; }
  .lic .lock { width: 46px; height: 46px; stroke: var(--green); fill: none; stroke-width: 1.6; }
  .lic h2 { font-size: 15px; margin: 8px 0 4px; }
  .contact { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; text-align: left; }
  .contact b { display: block; font-size: 13px; color: var(--navy); margin-bottom: 4px; }
  .contact a { color: var(--green); }
  textarea.key { font-family: Consolas, Menlo, monospace; font-size: 10.5px; min-height: 70px; word-break: break-all; }
  /* redaktori i paramases */
  .edbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 8px; }
  .edbar .tot { margin-left: auto; font-size: 13px; }
  .eg { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 5px; background: var(--card); }
  .egh { display: flex; align-items: center; gap: 6px; padding: 5px 7px; cursor: pointer; }
  .egh b { flex: 1; min-width: 0; font-size: 11.5px; color: var(--navy); }
  .egh .money { font-size: 11px; white-space: nowrap; }
  .eg.off > .egh b, .el.off .elh .d { text-decoration: line-through; opacity: .55; }
  .egb { border-top: 1px solid var(--line); padding: 3px 7px 6px; }
  .el { border-bottom: 1px dotted var(--line); padding: 4px 0; }
  .el:last-of-type { border-bottom: none; }
  .elh { display: flex; align-items: flex-start; gap: 5px; }
  .elh .c { color: var(--muted); font-size: 10.5px; min-width: 34px; padding-top: 1px; }
  .elh .d { flex: 1; min-width: 0; font-size: 11px; }
  .elh .v { font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .elc { display: flex; align-items: center; gap: 4px; margin: 3px 0 0 22px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .elc input[type=number] { width: 78px; padding: 2px 4px; text-align: right; }
  .elc select { width: auto; padding: 2px 3px; }
  .elc input.chg, .elc select.chg, .elp .chg { border-color: var(--green); background: var(--green-soft); }
  .elc a, .eg a.add { color: var(--green); cursor: pointer; font-size: 11px; }
  .elp { display: grid; grid-template-columns: auto 1fr; gap: 3px 6px; margin: 4px 0 0 22px; font-size: 11px; align-items: center; }
  .elp select, .elp input { padding: 2px 4px; }
  .el.cu input.dsc { width: 100%; padding: 2px 4px; }
  .stale { color: var(--warn); font-size: 11px; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" src="" style="display:none">
  <div class="t"><b>ARBS Studio</b><span id="projName">Archicad · Republika e Kosovës</span></div>
  <span class="ver" id="ver">v0.1</span>
</header>
<div id="licBar" class="hide"></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer><div class="msg" id="msg">Gati.</div><button id="openLic" title="Licenca e abonimit">Licenca</button><button id="openLog" title="Hap log-un diagnostik">Log</button><button id="openFolder" title="Hap dosjen e dokumenteve">Dosja</button></footer>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- ikonat
  const I = {
    profile: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/>',
    template: '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M9 9v11.5"/>',
    composites: '<path d="M4 6h16M4 10h16M4 14h16M4 18h16"/><path d="M8 6v12" stroke-dasharray="2 2"/>',
    techdesc: '<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5V8h4M9.5 12h6M9.5 15h6M9.5 18h4"/>',
    physics: '<path d="M4 19c3-9 6-12 8-12s4 6 8 6"/><path d="M4 5h4M4 9h2"/><circle cx="17" cy="6" r="2"/>',
    insolation: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
    schedules: '<rect x="4" y="3.5" width="7" height="17" rx="1"/><rect x="13" y="7" width="7" height="7" rx="1"/><path d="M13 10.5h7M16.5 7v7M9 12h.01"/>',
    boq: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8v3H8zM8.5 13.5h.01M12 13.5h.01M15.5 13.5h.01M8.5 17h.01M12 17h.01M15.5 17h.01"/>',
    plan: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M7 13h5M10 16.5h6"/>'
  };
  const SECTIONS = [
    ['profile', 'Projekti'], ['template', 'Template'], ['composites', 'Kompozitat'], ['techdesc', 'Përshkrimi'], ['boq', 'Paramasa'],
    ['physics', 'Fizika'], ['insolation', 'Insolimi'], ['schedules', 'Skemat'], ['plan', 'Plani dinamik']
  ];

  // ---------------------------------------------------------------- ura C++
  // Ura ARBS (C++) regjistrohet nga Archicad pak pas ngarkimit te faqes: presim deri ne 10 s.
  function bridgeReady () {
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function check () {
        if (window.ARBS && typeof window.ARBS.Call === 'function') return resolve(true);
        if (window.ARBSMock) return resolve(false);
        if (Date.now() - t0 > 10000) return resolve(false);
        setTimeout(check, 50);
      })();
    });
  }
  // Radha e vetme: thirrjet drejt Archicad-it kalojne nje nga nje (asnjehere dy njekohesisht),
  // secila me kufi kohor; "Liro paletën" e zhbllokon paleten pa pritur pergjigjen.
  const TIMEOUT = { init: 60, pending: 15, log: 15, clientLog: 10, open: 20, saveOffice: 30, saveProject: 60, savePrices: 30, saveBoqSettings: 30, license: 15, activateLicense: 20 };
  const QUEUE = { chain: Promise.resolve(), epoch: 0, current: null, started: 0 };
  function rawCall (cmd, data) {
    const req = JSON.stringify(Object.assign({ cmd: cmd }, data || {}));
    return bridgeReady().then(function (ok) {
      if (ok) return window.ARBS.Call(req).then(function (r) {
        try { return JSON.parse(r); }
        catch (e) { return { ok: false, error: 'Përgjigje e pavlefshme nga add-on-i (' + (r ? String(r).length : 0) + ' karaktere): ' + e.message }; }
      });
      return window.ARBSMock ? window.ARBSMock(cmd, data || {}) : { ok: false, error: 'Lidhja me Archicad-in nuk u krijua. Mbyllni dhe rihapni paletën.' };
    });
  }
  function call (cmd, data) {
    const epoch = QUEUE.epoch;
    const job = function () {
      if (epoch !== QUEUE.epoch) return { ok: false, error: 'Anuluar (paleta u lirua).', cancelled: true };
      QUEUE.current = cmd; QUEUE.started = Date.now();
      const limit = (TIMEOUT[cmd] || 900) * 1000;
      let timer = null;
      const timeout = new Promise(function (resolve) {
        timer = setTimeout(function () {
          resolve({ ok: false, timeout: true, error: 'Archicad-i nuk u përgjigj për «' + cmd + '» brenda ' + Math.round(limit / 1000) + ' s. Shikoni log-un (butoni Log).' });
        }, limit);
      });
      return Promise.race([rawCall(cmd, data), timeout]).then(function (r) {
        clearTimeout(timer);
        QUEUE.current = null;
        if (r && r.timeout) clientLog('kohe e tejkaluar: ' + cmd);
        if (epoch !== QUEUE.epoch) return { ok: false, error: 'Anuluar (paleta u lirua).', cancelled: true };
        return r;
      }, function (e) { clearTimeout(timer); QUEUE.current = null; return { ok: false, error: String(e) }; });
    };
    const p = QUEUE.chain.then(job, job);
    QUEUE.chain = p.then(function () {}, function () {});
    return p;
  }
  function clientLog (msg) {
    // jashte radhes: vetem shenim ne log, C++ e pranon edhe kur nje komande po punon
    rawCall('clientLog', { message: msg }).then(function () {}, function () {});
  }
  // zhbllokon paleten: injoron pergjigjet qe vijne me vone dhe fillon radhe te re
  function releasePalette () {
    clientLog('lirim manual i paletes' + (QUEUE.current ? ' gjate ' + QUEUE.current : ''));
    QUEUE.epoch++;
    QUEUE.chain = Promise.resolve();
    QUEUE.current = null;
    S.busy = false;
    stopTicker();
    status('Paleta u lirua. Nëse Archicad-i po punon ende, prisni pak para veprimit të radhës.', 'err');
  }

  const S = { section: 'profile', catalog: null, office: {}, project: {}, plan: {}, model: null, busy: false };
  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  const num = function (v, d) { return (Number(v) || 0).toFixed(d == null ? 2 : d).replace('.', ','); };

  function status (text, kind) {
    const m = $('msg');
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.innerHTML = text;
  }

  let ticker = null;
  function stopTicker () { if (ticker) { clearInterval(ticker); ticker = null; } }
  function startTicker (label) {
    stopTicker();
    const t0 = Date.now();
    const draw = function () {
      const sec = Math.round((Date.now() - t0) / 1000);
      status('<span class="spin"></span> ' + esc(label) + ' · ' + sec + ' s' + (sec >= 20 ? ' · <a href="#" id="releaseLink">Liro paletën</a>' : ''));
      const l = $('releaseLink');
      if (l) l.onclick = function (e) { e.preventDefault(); releasePalette(); };
    };
    draw();
    ticker = setInterval(draw, 1000);
  }

  function run (cmd, data, label) {
    if (S.busy) {
      const sec = Math.round((Date.now() - (S.busySince || Date.now())) / 1000);
      status('Prisni: «' + esc(String(S.busyLabel || '').replace(/\s+u\s+(gjenerua|gjeneruan|krijua|krijuan|ruajt|ruajtën|llogarit|lexua|lexuan|vendos|rikthyen)\b.*$/i, '')) + '» është ende në punë (' + sec + ' s). <a href="#" id="releaseLink">Liro paletën</a>', 'err');
      const l = $('releaseLink');
      if (l) l.onclick = function (e) { e.preventDefault(); releasePalette(); };
      return Promise.resolve(null);
    }
    S.busy = true;
    S.busySince = Date.now();
    S.busyLabel = label || cmd;
    const epoch = QUEUE.epoch;
    startTicker('Në punë: ' + String(label || cmd).replace(/\s+u\s+(gjenerua|gjeneruan|krijua|krijuan|ruajt|ruajtën|llogarit|lexua|lexuan|vendos|rikthyen)\b.*$/i, ''));
    return call(cmd, data).then(function (r) {
      if (epoch !== QUEUE.epoch) return null;		// paleta u lirua nderkohe
      S.busy = false;
      stopTicker();
      if (r && r.licenseRequired) { status(esc(r.error || 'Licenca mungon.'), 'err'); S.license = r.license; licenseUi(); return null; }
      if (!r || !r.ok) { status(esc((r && r.error) || 'Gabim i panjohur.'), 'err'); return r; }
      status('U krye: ' + esc(label || cmd), 'ok');
      if (r.openFile) call('open', { path: r.openFile });	// dokumenti hapet pasi pergjigja te kete arritur
      return r;
    }).catch(function (e) { S.busy = false; stopTicker(); status(esc(String(e)), 'err'); return null; });
  }

  function filesHtml (r) {
    if (!r || !r.files || !r.files.length) return '';
    return '<div class="files">' + r.files.map(function (f) { return '<a data-open="' + esc(f) + '">' + esc(f.split(/[\\/]/).pop()) + '</a>'; }).join('') + '</div>';
  }

  document.addEventListener('click', function (e) {
    const a = e.target.closest('[data-open]');
    if (a) { call('open', { path: a.getAttribute('data-open') }); }
  });
  $('openFolder').onclick = function () { call('open', {}); };
  $('openLic').onclick = function () { open('license'); };
  $('licBar').onclick = function () { open('license'); };
  $('openLog').onclick = function () { rawCall('log', { open: true }).then(function (r) { if (r && r.path) status('Log-u: ' + esc(r.path)); }); };

  // ---------------------------------------------------------------- navigimi
  function buildNav () {
    $('nav').innerHTML = SECTIONS.map(function (s) {
      return '<button data-s="' + s[0] + '" title="' + s[1] + '"><svg viewBox="0 0 24 24">' + I[s[0]] + '</svg>' + s[1] + '</button>';
    }).join('');
    $('nav').onclick = function (e) { const b = e.target.closest('button'); if (b) open(b.getAttribute('data-s')); };
  }

  function open (section) {
    S.section = section;
    Array.prototype.forEach.call($('nav').children, function (b) { b.classList.toggle('on', b.getAttribute('data-s') === section); });
    const r = RENDER[section] || RENDER.profile;
    $('main').innerHTML = r();
    if (BIND[section]) BIND[section]();
    $('main').scrollTop = 0;
  }

  // ---------------------------------------------------------------- seksionet
  const OFFICE_FIELDS = [['kompania', 'Kompania / Studio'], ['arkitekti', 'Arkitekti përgjegjës'], ['titulli', 'Titulli (p.sh. Mr.sc. Arkitekt)'], ['licenca', 'Nr. i licencës'],
    ['adresa', 'Adresa'], ['telefoni', 'Telefoni'], ['email', 'Email'], ['web', 'Web-faqja']];

  const RENDER = {
    profile: function () {
      const fields = (S.catalog && S.catalog.projectFields) || [];
      const phases = (S.catalog && S.catalog.phases) || [];
      const dest = (S.catalog && S.catalog.destinations) || {};
      const curDest = (dest.destinations || []).filter(function (d) { return d.code === S.project.destinimi_kodi; })[0];
      let h = '<h2>Profili i zyrës dhe projekti</h2><p class="sub">Të dhënat shfaqen në fletat, përshkrimin teknik dhe në Project Info të Archicad-it.</p>';
      h += '<div class="card"><h3>Profili i zyrës</h3>';

  // ---------------------------------------------------------------- struktura e kompleksit (blloqe, hyrje, njesi)
  function manual () {
    const m = S.project.njesite_manual || {};
    return { types: m.types || [], placements: m.placements || [], common: m.common || {} };
  }
  function roomsText (rooms) { return (rooms || []).map(function (r) { return r.name + ' = ' + num(r.area); }).join('\n'); }
  function parseRooms (txt) {
    return String(txt || '').split('\n').map(function (l) {
      const m = l.match(/^\s*(.*?)[\s=:;]+([\d]+(?:[.,]\d+)?)\s*(m2|m²)?\s*$/i);
      return m && m[1] ? { name: m[1].trim(), area: Number(m[2].replace(',', '.')) } : null;

  // lexon formularin e struktures ne S.project (thirret para ruajtjes dhe para cdo ndryshimi te listave)
  function readStructure () {
    if (!$('stShared')) return;
    const p = S.project;
    p.bodrumi_perbashket = $('stShared').checked;
    ['Kb:koef_ballkon', 'Kl:koef_lozhe', 'Kt:koef_terase'].forEach(function (x) { const a = x.split(':'); const v = $('st' + a[0]).value; if (v === '') delete p[a[1]]; else p[a[1]] = Number(v); });
    p.blloqet_zhvendosja = Number($('stOff').value) || 0;
    const bts = {};
    document.querySelectorAll('[data-bts]').forEach(function (i) { if (i.value !== '') bts[i.getAttribute('data-bts')] = Number(i.value); });
    p.blloqet_bts = bts;
    const m = manual();
    m.types.forEach(function (t, i) {
      t.code = $q('[data-tcode="' + i + '"]').value.trim() || ('T' + (i + 1));
      t.name = $q('[data-tname="' + i + '"]').value;
      t.kind = $q('[data-tkind="' + i + '"]').value;
      t.gross = Number($q('[data-tgross="' + i + '"]').value) || 0;
      t.rooms = parseRooms($q('[data-trooms="' + i + '"]').value);
    });
    m.placements.forEach(function (pl, i) {
      pl.type = $q('[data-ptype="' + i + '"]').value.trim();
      pl.block = $q('[data-pblock="' + i + '"]').value.trim();
      pl.entrance = $q('[data-pentr="' + i + '"]').value.trim() || 'H1';
      pl.floors = $q('[data-pfloors="' + i + '"]').value.trim() || '1';
      pl.perFloor = Number($q('[data-pper="' + i + '"]').value) || 1;
    });
    const common = {};
    $('mCommon').value.split('\n').forEach(function (l) { const x = l.match(/^\s*(\S+)\s*[=:]\s*([\d.,]+)/); if (x) common[x[1]] = Number(x[2].replace(',', '.')); });
    m.common = common;
    p.njesite_manual = m;
  }
  function $q (sel) { return document.querySelector(sel) || { value: '' }; }
  function bindStructure () {
    if (!$('stShared')) return;
    function rerender () { const st = $('main').scrollTop; readProfileForm(); open('profile'); $('main').scrollTop = st; }
    $('readStruct').onclick = function () { readProfileForm(); run('structureInfo', {}, 'Blloqet u lexuan nga modeli').then(function (r) { if (r && r.ok) { S.structure = r; rerender(); } }); };
    $('tAdd').onclick = function () { readStructure(); const m = manual(); m.types.push({ code: String.fromCharCode(65 + m.types.length), name: 'Banesa tip ' + String.fromCharCode(65 + m.types.length), kind: 'banesa', rooms: [] }); S.project.njesite_manual = m; rerender(); };
    $('pAdd').onclick = function () { readStructure(); const m = manual(); m.placements.push({ type: (m.types[0] || {}).code || 'A', block: ((S.structure || {}).blocks || [{}])[0].code || 'B1', entrance: 'H1', floors: '1-7', perFloor: 1 }); S.project.njesite_manual = m; rerender(); };
    document.querySelectorAll('[data-tdel]').forEach(function (b) { b.onclick = function () { readStructure(); const m = manual(); m.types.splice(Number(b.getAttribute('data-tdel')), 1); S.project.njesite_manual = m; rerender(); }; });
    document.querySelectorAll('[data-pdel]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); readStructure(); const m = manual(); m.placements.splice(Number(a.getAttribute('data-pdel')), 1); S.project.njesite_manual = m; rerender(); }; });
  }
  function readProfileForm () {
    Object.assign(S.project, readInputs('data-proj'));

  function defaultStart () { const d = new Date(); d.setMonth(d.getMonth() + 1); d.setDate(1); return d.toISOString().slice(0, 10); }

  function layerBar (c) {
    const colors = { 'Konstruksion': '#b9bfc6', 'Murature': '#d99a73', 'Termoizolim': '#f4e27a', 'Membrana': '#3b4a5a', 'Suva': '#ece7dc', 'Fasadë': '#ece7dc', 'Dysheme': '#c8b28c', 'Dru': '#b8875a', 'Dheu': '#a59a83' };
    const total = c.layers.reduce(function (a, l) { return a + l.d; }, 0) || 1;
    return '<div class="bar">' + c.layers.map(function (l) { return '<i title="' + esc(l.material) + '" style="flex:' + Math.max(l.d / total, 0.015) + ';background:' + (l.vent ? '#fff' : (colors[l.group] || guessColor(l.material))) + '"></i>'; }).join('') + '</div>';
  }
  function guessColor (name) {
    name = name.toLowerCase();
    if (/eps|xps|lesh|pir|polistiren/.test(name)) return '#f4e27a';
    if (/beton/.test(name)) return '#b9bfc6';
    if (/bllok|tull/.test(name)) return '#d99a73';
    if (/membran|hidroizol|folie|barrier|gjeotek|drenazh/.test(name)) return '#3b4a5a';
    if (/parket|dru|osb|letva/.test(name)) return '#b8875a';
    if (/pllak|estrih|ngjit/.test(name)) return '#c8b28c';
    if (/zhavor|substrat/.test(name)) return '#a59a83';
    return '#ece7dc';
  }

  function bindEditor (params) {
    const box = $('boqEd');

    function load () {

      if (S.boqEd && S.boqEd.dirty) req.settings = S.boqEd.set;
      run('billOfQuantities', req, 'Redaktori u ngarkua nga modeli').then(function (r) {
        if (!r || !r.ok || !r.editor) return;
        const prev = S.boqEd;
        S.boqEd = { data: r.editor, set: edSettings(r.settings), open: prev ? prev.open : {}, props: prev ? prev.props : {}, dirty: false, stale: false };
        S.project.paramasa = edSettings(r.settings);
        const st = $('main').scrollTop; open('boq'); $('main').scrollTop = st;
      });
    }
    $('edLoad').onclick = load;
    if ($('edSave')) $('edSave').onclick = function () {
      run('saveBoqSettings', { settings: S.boqEd.set }, 'Zgjedhjet e paramasës u ruajtën').then(function (r) {
        if (r && r.ok) { S.boqEd.set = edSettings(r.settings); S.boqEd.dirty = false; S.project.paramasa = edSettings(r.settings); edRender(); }
      });
    };
    if ($('edReset')) $('edReset').onclick = function () {
      S.boqEd.set = edSettings({}); changed(true); edRender();
      status('Zgjedhjet u pastruan (ruhen me «Ruaj zgjedhjet» ose me gjenerimin).', 'ok');
    };
    if (!S.boqEd) return;
    box.onclick = function (e) {
      const t = e.target, E = S.boqEd;
      if (t.matches('input, select, option, datalist')) return;
      const a = t.closest('[data-pt],[data-add],[data-cx],[data-egt]');
      if (!a) return;
      if (a.hasAttribute('data-pt')) { const k = a.getAttribute('data-pt'); E.props[k] = !E.props[k]; edRender(); return; }
      if (a.hasAttribute('data-add')) {
        E.set.custom.push({ id: 'c' + Date.now().toString(36), g: a.getAttribute('data-add'), d: '', u: 'copë', q: 1, p: 0, on: true });
        changed(false); edRender(); return;
      }
      if (a.hasAttribute('data-cx')) { const id = a.getAttribute('data-cx'); E.set.custom = E.set.custom.filter(function (c) { return c.id !== id; }); changed(false); edRender(); return; }
      if (a.hasAttribute('data-egt')) { const g = a.getAttribute('data-egt'); E.open[g] = !E.open[g]; edRender(); }
    };
    box.onchange = function (e) {
      const t = e.target, E = S.boqEd;
      const cust = function (attr) { const id = t.getAttribute(attr); return E.set.custom.filter(function (c) { return c.id === id; })[0]; };
      let k;
      if ((k = t.getAttribute('data-eg')) != null) {
        const i = E.set.off_groups.indexOf(k);
        if (t.checked && i >= 0) E.set.off_groups.splice(i, 1);
        if (!t.checked && i < 0) E.set.off_groups.push(k);
        changed(false);
      } else if ((k = t.getAttribute('data-el')) != null) {
        const it = edItem(k, true); if (t.checked) delete it.on; else it.on = false; edClean(k); changed(false);
      } else if ((k = t.getAttribute('data-q')) != null) {
        const it = edItem(k, true); if (t.value === '' || isNaN(Number(t.value))) delete it.q; else it.q = Math.max(0, Number(t.value)); edClean(k); changed(false);
      } else if ((k = t.getAttribute('data-p')) != null) {
        const it = edItem(k, true); if (t.value === '' || isNaN(Number(t.value))) delete it.p; else it.p = Math.max(0, Number(t.value)); edClean(k); changed(false);
      } else if ((k = t.getAttribute('data-u')) != null) {
        const it = edItem(k, true); const line = edFind(k);
        if (line && t.value === line.unit && !line.qtyOverridden) delete it.u; else it.u = t.value;
        delete it.q; edClean(k); changed(true);
      } else if ((k = t.getAttribute('data-pv')) != null) {

        it.props = it.props || {};
        if (t.value === '') delete it.props[id]; else it.props[id] = t.value;
        edClean(k); changed(true);
      } else if (t.hasAttribute('data-con')) { const c = cust('data-con'); if (c) c.on = t.checked; changed(false); }
      else if (t.hasAttribute('data-cd')) { const c = cust('data-cd'); if (c) c.d = t.value; changed(false); }
      else if (t.hasAttribute('data-cq')) { const c = cust('data-cq'); if (c) c.q = Math.max(0, Number(t.value) || 0); changed(false); }
      else if (t.hasAttribute('data-cu')) { const c = cust('data-cu'); if (c) c.u = t.value || 'copë'; changed(false); }
      else if (t.hasAttribute('data-cp')) { const c = cust('data-cp'); if (c) c.p = Math.max(0, Number(t.value) || 0); changed(false); }
      else return;
      const st = $('main').scrollTop; edRender(); $('main').scrollTop = st;
    };
    edRender();
  }

    $('ver').textContent = 'v' + r.version;
    if (S.project.emri) $('projName').textContent = (S.project.nr ? S.project.nr + ' · ' : '') + S.project.emri;
    if (r.catalogError) status('Të dhënat: ' + esc(r.catalogError), 'err');
    else status('Gati · dokumentet ruhen në: ' + esc(r.folder || ''));
    S.ready = true;
    S.license = r.license || { usable: true };
    if (!licenseUi()) return;
    doPending().then(function (handled) {
      if (!handled) open(S.section);
    });
    }).catch(function (e) { status('Gabim gjatë nisjes: ' + esc(String(e)), 'err'); });
  }
  function PRetry () { return $('retry'); }
  boot();
})();
</script>
</body>
</html>
